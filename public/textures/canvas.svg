<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <pattern id="canvas" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#d4c4b0"/>
      <g stroke="#b0a090" stroke-width="0.3" opacity="0.2">
        <line x1="0" y1="0" x2="100" y2="100"/>
        <line x1="0" y1="10" x2="100" y2="110"/>
        <line x1="0" y1="20" x2="100" y2="120"/>
        <line x1="0" y1="30" x2="100" y2="130"/>
        <line x1="0" y1="40" x2="100" y2="140"/>
        <line x1="0" y1="50" x2="100" y2="150"/>
        <line x1="0" y1="60" x2="100" y2="160"/>
        <line x1="0" y1="70" x2="100" y2="170"/>
        <line x1="0" y1="80" x2="100" y2="180"/>
        <line x1="0" y1="90" x2="100" y2="190"/>
        <line x1="100" y1="0" x2="0" y2="100"/>
        <line x1="110" y1="0" x2="10" y2="100"/>
        <line x1="120" y1="0" x2="20" y2="100"/>
        <line x1="130" y1="0" x2="30" y2="100"/>
        <line x1="140" y1="0" x2="40" y2="100"/>
        <line x1="150" y1="0" x2="50" y2="100"/>
        <line x1="160" y1="0" x2="60" y2="100"/>
        <line x1="170" y1="0" x2="70" y2="100"/>
        <line x1="180" y1="0" x2="80" y2="100"/>
        <line x1="190" y1="0" x2="90" y2="100"/>
      </g>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#canvas)"/>
</svg>